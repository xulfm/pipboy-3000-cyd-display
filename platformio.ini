; ============================================================
; PIP-BOY 3000 — PlatformIO Configuration
; Board: ESP32-2432S028R ("Cheap Yellow Display")
;
; Two display variants share everything but the panel driver:
;   env:cyd         ILI9341 — original / most common (micro-USB)
;   env:cyd_st7789  ST7789  — newer USB-C "2-USB" revisions
;                            (needs colour inversion ON)
;
; Plus the bigger screen for the Pip-Boy shell:
;   env:freenove35  Freenove ESP32-S3 Display 3.5" (FNK0104N)
;                   ST77922 QSPI panel, capacitive touch, PSRAM
;
; Build a specific variant:   pio run -e cyd
;                             pio run -e cyd_st7789
;                             pio run -e freenove35
; ============================================================

; ── Settings shared by every board ──
[common]
platform  = espressif32@^6.9.0
framework = arduino

upload_speed  = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.flash_mode  = qio
board_build.f_cpu       = 240000000L

build_flags =
    ; LVGL — include/ dir added so lv_conf.h is always found
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -DVAULT_GREEN=0x04F0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=0
    ; NimBLE — lightweight BLE stack, minimal config
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_BONDS=0
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=8
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=128
    -DCONFIG_BT_NIMBLE_SVC_GAP_APPEARANCE=0

lib_deps =
    lvgl/lvgl @ ~8.3.11
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^1.4.1

; ── Cheap Yellow Display (ESP32-2432S028R) base ──
[cyd_base]
extends = common
board   = esp32dev

board_build.partitions = min_spiffs.csv
board_build.flash_freq  = 80m

build_flags =
    ${common.build_flags}
    ; ── TFT_eSPI driver — UPPERCASE is required ──
    -DUSER_SETUP_LOADED
    ; CYD display SPI pins
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    ; Touch pins (XPT2046, R variant)
    -DTOUCH_CS=33
    -DTOUCH_IRQ=36
    ; SPI speeds
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

lib_deps =
    ${common.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; ── ILI9341: original / most common CYD (micro-USB, single-USB) ──
[env:cyd]
extends = cyd_base
build_flags =
    ${cyd_base.build_flags}
    -DILI9341_DRIVER

; ── ST7789: newer USB-C "2-USB" CYD revisions. The ST7789 panels on
;    these boards render inverted unless TFT_INVERSION_ON is set. If
;    colours still look wrong, try removing TFT_INVERSION_ON or adding
;    -DTFT_RGB_ORDER=TFT_BGR. ──
[env:cyd_st7789]
extends = cyd_base
build_flags =
    ${cyd_base.build_flags}
    -DST7789_DRIVER
    -DTFT_INVERSION_ON

; ── Freenove ESP32-S3 Display 3.5" (FNK0104N) ──
;    16MB flash + 8MB octal PSRAM, native USB-C.
;    The Pip-Boy UI still runs at 320x240 and is scaled up to the
;    480x320 panel (see include/freenove35_display.h).
;      FN35_ROTATION = 1 or 3  -> swap if the picture is upside down
;      FN35_FILL     = 1       -> stretch to fill the whole screen
;                      0       -> keep the original shape, thin side bars
[env:freenove35]
extends = common
board   = esp32-s3-devkitc-1

board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

build_flags =
    ${common.build_flags}
    -DBOARD_FREENOVE35
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFN35_ROTATION=1
    -DFN35_FILL=1
    ; Night mode (6pm-7am) caps the backlight; ~60% here instead of the
    ; CYD's ~6%, so it's still readable on a night-time walk.
    -DBL_NIGHT_LEVEL_DEFAULT=153
